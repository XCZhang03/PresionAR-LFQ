experiment:
    project: "MaskBit"
    name: "resar_generator_10bit"
    run_name: "stage3-4lvl"
    max_train_examples: 1_281_167 # total number of imagenet examples
    save_every: 1_000
    eval_loss_every: 20_000
    eval_gen_every: 40_000
    generate_every: 10_000
    log_every: 50
    log_grad_norm_every: 100_000
    logger: "wandb"
    resume: True
    vqgan_checkpoint: "MODEL_PATH/maskbit_tokenizer_10bit.bin"

model:
    vq_model:
        model_class: "rqgan"
        quantizer_type: "residual_lfq"
        token_size: 10
        commitment_cost: 0.25
        entropy_loss_weight: 0.02
        entropy_loss_temperature: 0.01
        entropy_gamma: 1.0
        num_channels: 3  # rgb
        hidden_channels: 128
        channel_mult: [1,1,2,2,4]
        num_resolutions: 5
        num_res_blocks: 2
        sample_with_conv: True

        ## residual quantization
        num_quantizers: 4
        scales: null 
        variants: [2,3,3,3]
        ## precision schedule
        schedule_type: "uniform"
    
    ar_model:
        num_stages: 4
        cur_stage: 3

    cond_model:
        model_cls: "cond_lfq_bert"
        stage: [1,2,3]
        hidden_dim: [768, 512, 256]
        depth: [20, 16, 12]
        heads: [12, 8, 4]
        mlp_ratio: 4.0
        dropout: 0.0
        drop_path: 0.0
        attn_l2_norm: True
        label_conditioning: "concat"
        guidance_scale: 6.4
        guidance_annealing: "cosine"
        num_steps: 64
        train_mask_schedule_strategy: "arccos"
        gen_mask_schedule_strategy: "arccos"
        softmax_temperature: 1.0
        randomize_temperature: 10.5
        class_label_dropout: 0.1
        scale_pow: 2.5
        use_sampling_annealing: False
        codebook_splits: 2
    
    base_model:
        model_cls: "lfq_bert"
        hidden_dim: 1024
        depth: 24
        heads: 16
        mlp_dim: 4096
        dropout: 0.1
        guidance_scale: 6.4
        guidance_annealing: "cosine"
        num_steps: 64
        train_mask_schedule_strategy: "arccos"
        gen_mask_schedule_strategy: "arccos"
        softmax_temperature: 1.0
        randomize_temperature: 10.5
        class_label_dropout: 0.1
        scale_pow: 2.5
        use_sampling_annealing: False
        codebook_splits: 2
        use_prenorm: False

losses:
    mlm:
        label_smoothing: 0.1
        sum_splits: False


dataset:
    params:
        train_shards_path_or_url: "./shards/train/imagenet-train-{0000..0252}.tar"
        eval_shards_path_or_url: "./shards/val/imagenet-val-{0000..0009}.tar"
        shuffle_buffer_size: 1000
        num_workers_per_gpu: 8
        pin_memory: True
        persistent_workers: True
    preprocessing:
        resolution: 256
        use_aspect_ratio_aug: False
        use_random_crop: True
        min_scale: 0.8
        interpolation: "bicubic"


optimizer:
    name: adamw 
    params:
        learning_rate: 1e-4
        beta1: 0.9
        beta2: 0.96
        weight_decay: 0.045
        epsilon: 1e-8


lr_scheduler:
    scheduler: "cosine_with_minimum"
    params:
        learning_rate: ${optimizer.params.learning_rate}
        warmup_steps: 5_000


training:
    gradient_accumulation_steps: 1
    per_gpu_batch_size: 32
    mixed_precision: "no"
    enable_tf32: True
    use_ema: True
    seed: 42
    max_train_steps: 600_000
    overfit_batch: False
    overfit_batch_num: 1
    num_generated_images: 4 # Must be smaller than or equal to per_gpu_batch_size
    max_grad_norm: 1.0